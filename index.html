<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jujutsu Kombat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <script src="js/util.js?v=12"></script>
  <script src="js/audio.js?v=12"></script>

  <script src="js/vfx.js?v=12"></script>
  <script src="js/moves.js?v=12"></script>
  <script src="js/stages.js?v=12"></script>
  <script src="js/fighter.js?v=12"></script>
  <script src="js/ai.js?v=12"></script>
  <script src="js/hud.js?v=12"></script>
