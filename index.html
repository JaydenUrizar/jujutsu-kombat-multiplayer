<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Jujutsu Kombat">
  <meta name="theme-color" content="#000000">
  <meta name="format-detection" content="telephone=no">
  <title>Jujutsu Kombat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@500;700&family=Yuji+Syuku&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0; height: 100%; background: #000; overflow: hidden;
      position: fixed; inset: 0; overscroll-behavior: none;
      touch-action: none; -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
    }
    /* sized by main.js; the small initial size keeps phones from widening the layout viewport */
    canvas { position: fixed; left: 0; top: 0; width: 1px; height: 1px; display: block; image-rendering: auto; }
    #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      color: #c9a24a; font: 28px Impact, sans-serif; letter-spacing: 6px; text-align: center; }
    #safe-probe { position: fixed; visibility: hidden; pointer-events: none;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }

    /* ---------------------------------------------------------- touch controls */
    #touch { position: fixed; inset: 0; pointer-events: none; z-index: 5; display: none;
      font-family: "Bebas Neue", Impact, sans-serif; color: #fff; }
    #touch.on { display: block; }
    #touch .zone { position: absolute; pointer-events: auto; }
    #touch .stick-base { position: absolute; border-radius: 50%; pointer-events: none;
      background: radial-gradient(circle, rgba(0,0,0,0.25), rgba(0,0,0,0.45));
      border: 2px solid rgba(201,162,74,0.55); box-sizing: border-box; }
    #touch .stick-knob { position: absolute; border-radius: 50%; pointer-events: none;
      background: radial-gradient(circle at 40% 35%, rgba(255,120,130,0.85), rgba(160,20,40,0.85));
      border: 2px solid rgba(255,210,122,0.9); box-sizing: border-box; }
    #touch .stick-base.active { border-color: rgba(255,210,122,0.9); }
    #touch .btn { position: absolute; pointer-events: auto; box-sizing: border-box;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      border-radius: 50%; border: 2px solid rgba(201,162,74,0.7);
      background: rgba(10,6,10,0.55); color: #f3e9dc; line-height: 1; white-space: nowrap; overflow: hidden;
      letter-spacing: 0.5px; text-shadow: 0 1px 2px #000; }
    #touch .btn small { font-family: "Rajdhani", sans-serif; font-weight: 700; font-size: 9px; letter-spacing: 0; opacity: 0.75; margin-top: 1px; }
    #touch .btn.pill { border-radius: 999px; }
    #touch .btn.down { background: rgba(200,30,50,0.85); border-color: #ffd27a; color: #fff; }
    #touch .btn.light { border-color: rgba(255,210,122,0.85); }
    #touch .btn.heavy { border-color: rgba(255,122,90,0.85); }
    #touch .btn.kick { border-color: rgba(143,224,122,0.85); }
    #touch .btn.tech { border-color: rgba(122,184,255,0.8); }
    #touch .btn.block { border-color: rgba(220,220,220,0.8); }
    #touch .btn.domain.ready { background: rgba(200,30,50,0.7); border-color: #ffd27a; animation: jk-pulse 0.8s ease-in-out infinite alternate; }
    #touch .btn.cooling { opacity: 0.55; }
    #touch .pause-zone { position: absolute; pointer-events: auto; }
    #touch .pause-zone span { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%);
      width: 18px; height: 18px; border-radius: 50%; background: rgba(10,6,10,0.75);
      border: 1.5px solid rgba(201,162,74,0.8); font: 8px/15px sans-serif; text-align: center; box-sizing: border-box; }
    #touch .pause-zone.down span { background: rgba(200,30,50,0.85); }
    @keyframes jk-pulse { from { box-shadow: 0 0 0 rgba(255,40,60,0.0); } to { box-shadow: 0 0 14px rgba(255,40,60,0.9); } }

    #rotate { position: fixed; left: 0; right: 0; display: none; text-align: center; pointer-events: none;
      color: #c9a24a; font: 600 15px "Rajdhani", sans-serif; letter-spacing: 1px; padding: 0 16px; z-index: 4; }
    #rotate b { display: block; font: 26px "Bebas Neue", Impact, sans-serif; color: #fff; letter-spacing: 2px; margin-bottom: 4px; }
    #rotate.on { display: block; }
  </style>
</head>
<body>
  <div id="loading">LOADING CURSED ENERGY…</div>
  <div id="safe-probe"></div>
  <canvas id="game" width="1280" height="720"></canvas>
  <div id="touch"></div>
  <div id="rotate"><b>↻ ROTATE YOUR PHONE</b>Turn sideways for a bigger view. Fights work either way.</div>
  <!-- PeerJS powers online versus (WebRTC). If it fails to load, single-player is unaffected. -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="js/util.js?v=14"></script>
  <script src="js/audio.js?v=14"></script>
  <script src="js/music.js?v=14"></script>
  <script src="js/input.js?v=14"></script>
  <script src="js/net.js?v=14"></script>
  <script src="js/rig.js?v=14"></script>
  <script src="js/characters.js?v=14"></script>
  <script src="js/vfx.js?v=14"></script>
  <script src="js/moves.js?v=14"></script>
  <script src="js/stages.js?v=14"></script>
  <script src="js/fighter.js?v=14"></script>
  <script src="js/ai.js?v=14"></script>
  <script src="js/hud.js?v=14"></script>
  <script src="js/game.js?v=14"></script>
  <script src="js/menus.js?v=14"></script>
  <script src="js/touch.js?v=14"></script>
  <script src="js/main.js?v=14"></script>
</body>
</html>
